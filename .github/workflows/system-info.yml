name: System Information

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Current Directory
        run: pwd

      - name: List Files
        run: ls

      - name: Current Date
        run: date

      - name: Node Version
        run: node -v

      - name: NPM Version
        run: npm -v